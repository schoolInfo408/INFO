<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Científica</title>
    <style>
        body {
            background: gray;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .calculadora {
            background: #222;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        .pantalla {
            width: 100%;
            height: 50px;
            text-align: right;
            font-size: 1.5em;
            padding: 10px;
            margin-bottom: 10px;
            background: #333;
            color: white;
            border: none;
        }
        .boton {
            width: 60px;
            height: 60px;
            margin: 5px;
            font-size: 1.2em;
            cursor: pointer;
            background: #444;
            color: white;
            border: none;
            border-radius: 5px;
        }
        .boton:hover {
            background: #666;
        }
    </style>
</head>
<body>
    <div class="calculadora">
        <input type="text" class="pantalla" id="pantalla" readonly>
        <br>
        <button class="boton" onclick="agregar('7')">7</button>
        <button class="boton" onclick="agregar('8')">8</button>
        <button class="boton" onclick="agregar('9')">9</button>
        <button class="boton" onclick="agregar('/')">/</button>
        <br>
        <button class="boton" onclick="agregar('4')">4</button>
        <button class="boton" onclick="agregar('5')">5</button>
        <button class="boton" onclick="agregar('6')">6</button>
        <button class="boton" onclick="agregar('*')">*</button>
        <br>
        <button class="boton" onclick="agregar('1')">1</button>
        <button class="boton" onclick="agregar('2')">2</button>
        <button class="boton" onclick="agregar('3')">3</button>
        <button class="boton" onclick="agregar('-')">-</button>
        <br>
        <button class="boton" onclick="agregar('0')">0</button>
        <button class="boton" onclick="agregar('.')">.</button>
        <button class="boton" onclick="calcular()">=</button>
        <button class="boton" onclick="agregar('+')">+</button>
        <br>
        <button class="boton" onclick="agregar('Math.sin(')">sin</button>
        <button class="boton" onclick="agregar('Math.cos(')">cos</button>
        <button class="boton" onclick="agregar('Math.tan(')">tan</button>
        <button class="boton" onclick="agregar('Math.sqrt(')">√</button>
        <br>
        <button class="boton" onclick="agregar('Math.pow(')">xⁿ</button>
        <button class="boton" onclick="agregar('Math.log(')">ln</button>
        <button class="boton" onclick="agregar('Math.exp(')">e^x</button>
        <button class="boton" onclick="borrar()">C</button>
    </div>
    
    <script>
        function agregar(valor) {
            document.getElementById("pantalla").value += valor;
        }
        function calcular() {
            try {
                document.getElementById("pantalla").value = eval(document.getElementById("pantalla").value);
            } catch (e) {
                alert("Expresión inválida");
            }
        }
        function borrar() {
            document.getElementById("pantalla").value = "";
        }
    </script>
</body>
</html>
